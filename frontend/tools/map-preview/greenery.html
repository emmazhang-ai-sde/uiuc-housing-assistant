<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>UIUC — Greenery illustrated basemap (Mediterranean)</title>
<link href="/node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<script src="/node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; background: #e9e4da; font-family: system-ui, sans-serif; color: #33302b; }
  h1 { font-size: 16px; margin: 16px 18px 4px; }
  p.sub { font-size: 12.5px; margin: 0 18px 14px; color: #7a746a; max-width: 90ch; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 14px 20px; }
  @media (max-width: 900px){ .grid { grid-template-columns: 1fr; } }
  .cell { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 5px rgba(0,0,0,0.12); }
  .cap { padding: 9px 13px; font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .cap small { font-weight: 400; color: #a09a8e; font-size: 11.5px; }
  .mapwrap { position: relative; }
  .map { width: 100%; height: 440px; }
  .grain {
    position: absolute; inset: 0; pointer-events: none;
    mix-blend-mode: multiply; opacity: 0.05; background-size: 220px 220px;
  }
  .ref { padding: 0 18px 24px; }
  .ref .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #555; background: #fff; padding: 5px 9px; border-radius: 8px; }
  .sw { width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(0,0,0,.08); }
</style>
</head>
<body>
<h1>UIUC campus — clean basemap (white / green / blue / brown / grey)</h1>
<p class="sub">White land, green parks, blue water, brown buildings with black outlines, grey roads. Left is neighborhood zoom, right is street/building zoom. Drag / scroll to explore. Real vector tiles, same MapLibre renderer as your app.</p>
<div class="grid" id="grid"></div>
<div class="ref">
  <div class="chips" id="chips"></div>
</div>
<script>
const OFM = name => `https://tiles.openfreemap.org/styles/${name}`;

// Clean palette: white land · green parks · blue water · brown buildings · grey roads · black outlines
const PAL = {
  LAND:"#FFFFFF", RESID:"#FBFBFA", ROAD:"#9E9E9E", CASE:"#1E1E1E", PATH:"#B4B4B4",
  LAWN:"#B7D9A0", WOOD:"#9BC47C", WATER:"#A6CEE8", WATERLINE:"#87B4DA",
  BLDG:"#B79A7C", BLDG_OUT:"#1E1E1E", LABEL:"#1A1A1A", HALO:"#FFFFFF", BOUNDARY:"#2A2A2A",
};

const CHIPS = [
  ["Land / paper","LAND"],["Roads","ROAD"],["Road casing","CASE"],["Parks / grass","LAWN"],
  ["Woods","WOOD"],["Water","WATER"],["Buildings","BLDG"],["Building edge","BLDG_OUT"],["Labels","LABEL"],
];
const chips = document.getElementById("chips");
for (const [name,key] of CHIPS){
  const c=document.createElement("div"); c.className="chip";
  c.innerHTML=`<span class="sw" style="background:${PAL[key]}"></span>${name} <code style="color:#aaa">${PAL[key]}</code>`;
  chips.appendChild(c);
}

const GRAIN_SVG = "<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>"
  + "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/>"
  + "<feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
const GRAIN_URL = `url("data:image/svg+xml,${encodeURIComponent(GRAIN_SVG)}")`;

const has = (id, ...keys) => keys.some(k => (id||"").toLowerCase().includes(k));
async function greeneryStyle(){
  const style = await (await fetch(OFM("positron"))).json();
  for (const layer of style.layers){
    const id=layer.id||"", t=layer.type, p=layer.paint=layer.paint||{};
    if (id==="background"){ p["background-color"]=PAL.LAND; continue; }
    if (has(id,"water")){ if(t==="fill")p["fill-color"]=PAL.WATER; if(t==="line")p["line-color"]=PAL.WATERLINE; }
    else if (has(id,"wood","forest")){ if(t==="fill")p["fill-color"]=PAL.WOOD; }
    else if (has(id,"park","grass","golf","pitch","cemetery","landcover","vegetation","farmland","meadow","garden","recreation")){ if(t==="fill")p["fill-color"]=PAL.LAWN; }
    else if (has(id,"residential","neighbourhood","suburb","landuse")){ if(t==="fill")p["fill-color"]=PAL.RESID; }
    else if (has(id,"building")){ if(t==="fill"){p["fill-color"]=PAL.BLDG;p["fill-outline-color"]=PAL.BLDG_OUT;} if(t==="fill-extrusion")p["fill-extrusion-color"]=PAL.BLDG; }
    else if (has(id,"boundary","admin")){ if(t==="line")p["line-color"]=PAL.BOUNDARY; }
    else if (has(id,"path","pedestrian","footway","track")){ if(t==="line")p["line-color"]=PAL.PATH; }
    else if (has(id,"road","transport","bridge","tunnel","highway","street","motorway","trunk","primary","secondary","tertiary","minor","service")){
      if(t==="line"){
        p["line-color"]=has(id,"casing","outline")?PAL.CASE:PAL.ROAD;
        layer.layout=Object.assign({},layer.layout||{},{"line-join":"round","line-cap":"round"});
      }
      if(t==="fill")p["fill-color"]=PAL.ROAD;
    }
    else if (has(id,"label","place","poi","name")){ if(t==="symbol"){p["text-color"]=PAL.LABEL;p["text-halo-color"]=PAL.HALO;p["text-halo-width"]=1.5;} }
  }
  return style;
}

const CELLS=[
  {sub:"neighborhood — zoom 14.3", z:14.3},
  {sub:"street / buildings — zoom 16", z:16},
];
const grid=document.getElementById("grid");
(async()=>{
  const style=await greeneryStyle();
  for(const c of CELLS){
    const cell=document.createElement("div"); cell.className="cell";
    const cap=document.createElement("div"); cap.className="cap";
    cap.innerHTML=`<span>Clean basemap</span><small>${c.sub}</small>`;
    const wrap=document.createElement("div"); wrap.className="mapwrap";
    const mapDiv=document.createElement("div"); mapDiv.className="map";
    const g=document.createElement("div"); g.className="grain"; g.style.backgroundImage=GRAIN_URL;
    wrap.appendChild(mapDiv); wrap.appendChild(g);
    cell.appendChild(cap); cell.appendChild(wrap); grid.appendChild(cell);
    new maplibregl.Map({ container:mapDiv, style:structuredClone(style), center:[-88.2272,40.1092], zoom:c.z, attributionControl:false });
  }
})();
</script>
</body>
</html>
