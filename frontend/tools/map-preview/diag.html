<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Map diagnostics</title>
<link href="/node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<script src="/node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background:#f4f2ee; color:#222; }
  h1 { font-size:16px; margin:14px 16px; }
  #log { margin:0 16px 14px; padding:12px 14px; background:#111; color:#7CFC98; font:12px/1.5 ui-monospace,Menlo,monospace; border-radius:8px; white-space:pre-wrap; max-height:220px; overflow:auto; }
  #log .err { color:#ff7a7a; }
  #log .warn { color:#ffd479; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 20px; }
  .cell { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .cap { padding:8px 12px; font-size:13px; font-weight:600; }
  .map { width:100%; height:340px; background:#dcdcdc; }
</style>
</head>
<body>
<h1>Basemap diagnostics — open this and tell me what the black log box says</h1>
<div id="log"></div>
<div class="grid">
  <div class="cell"><div class="cap">Control — raw positron (no custom code)</div><div id="m1" class="map"></div></div>
  <div class="cell"><div class="cap">Greenery — custom recolored style</div><div id="m2" class="map"></div></div>
</div>
<script>
const logEl = document.getElementById("log");
function log(msg, cls){ const d=document.createElement("div"); if(cls)d.className=cls; d.textContent=msg; logEl.appendChild(d); }
window.addEventListener("error", e => log("window error: " + (e.message || e), "err"));
window.addEventListener("unhandledrejection", e => log("promise rejected: " + (e.reason && (e.reason.message||e.reason)), "err"));

(function(){
  log("user agent: " + navigator.userAgent);
  log("maplibregl defined: " + (typeof maplibregl !== "undefined") + (typeof maplibregl!=="undefined" ? "  v" + (maplibregl.version||"?") : ""), typeof maplibregl==="undefined"?"err":null);
  // WebGL check
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl2") || c.getContext("webgl") || c.getContext("experimental-webgl");
    log("WebGL available: " + !!gl + (gl ? "  ("+ (c.getContext("webgl2")?"webgl2":"webgl1") +")" : ""), gl?null:"err");
    if (gl && gl.getExtension){ const dbg=gl.getExtension("WEBGL_debug_renderer_info"); if(dbg) log("GPU: " + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)); }
  } catch(e){ log("WebGL check threw: " + e.message, "err"); }
  if (typeof maplibregl !== "undefined") log("supported(): " + maplibregl.supported?.());
})();

const OFM = n => `https://tiles.openfreemap.org/styles/${n}`;
const CENTER=[-88.2272,40.1092], ZOOM=14;

// Control map — pure maplibre + URL style, isolates whether maplibre renders at all.
try {
  const m1 = new maplibregl.Map({ container:"m1", style:OFM("positron"), center:CENTER, zoom:ZOOM, attributionControl:false });
  m1.on("load", ()=>log("control map: LOAD ok ✓"));
  m1.on("error", e=>log("control map error: " + (e.error && e.error.message || JSON.stringify(e.error||e)), "err"));
} catch(e){ log("control map construct threw: " + e.message, "err"); }

// Custom greenery map — fetch + recolor.
const PAL={LAND:"#F2E6C9",RESID:"#ECDEBC",ROAD:"#FCF6E7",CASE:"#E3D0A2",PATH:"#E6D4A6",LAWN:"#93AC5C",WOOD:"#6F833E",WATER:"#54A7E2",WATERLINE:"#93C9EE",BLDG:"#E9CA9C",BLDG_OUT:"#CE9A61",LABEL:"#2E2A22",HALO:"#F7EFD7",BOUNDARY:"#C4A06E"};
const has=(id,...k)=>k.some(x=>(id||"").toLowerCase().includes(x));
(async()=>{
  try {
    log("fetching positron style JSON for recolor…");
    const res = await fetch(OFM("positron"));
    log("style fetch status: " + res.status);
    const style = await res.json();
    for (const layer of style.layers){
      const id=layer.id||"",t=layer.type,p=layer.paint=layer.paint||{};
      if(id==="background"){p["background-color"]=PAL.LAND;continue;}
      if(has(id,"water")){if(t==="fill")p["fill-color"]=PAL.WATER;if(t==="line")p["line-color"]=PAL.WATERLINE;}
      else if(has(id,"wood","forest")){if(t==="fill")p["fill-color"]=PAL.WOOD;}
      else if(has(id,"park","grass","golf","pitch","cemetery","landcover","vegetation","farmland","meadow","garden","recreation")){if(t==="fill")p["fill-color"]=PAL.LAWN;}
      else if(has(id,"residential","neighbourhood","suburb","landuse")){if(t==="fill")p["fill-color"]=PAL.RESID;}
      else if(has(id,"building")){if(t==="fill"){p["fill-color"]=PAL.BLDG;p["fill-outline-color"]=PAL.BLDG_OUT;}if(t==="fill-extrusion")p["fill-extrusion-color"]=PAL.BLDG;}
      else if(has(id,"boundary","admin")){if(t==="line")p["line-color"]=PAL.BOUNDARY;}
      else if(has(id,"path","pedestrian","footway","track")){if(t==="line")p["line-color"]=PAL.PATH;}
      else if(has(id,"road","transport","bridge","tunnel","highway","street","motorway","trunk","primary","secondary","tertiary","minor","service")){if(t==="line"){p["line-color"]=has(id,"casing","outline")?PAL.CASE:PAL.ROAD;}if(t==="fill")p["fill-color"]=PAL.ROAD;layer.layout=Object.assign({"line-join":"round","line-cap":"round"},layer.layout||{});}
      else if(has(id,"label","place","poi","name")){if(t==="symbol"){p["text-color"]=PAL.LABEL;p["text-halo-color"]=PAL.HALO;p["text-halo-width"]=1.5;}}
    }
    log("recolor done, layers: " + style.layers.length + " — constructing map…");
    const m2 = new maplibregl.Map({ container:"m2", style, center:CENTER, zoom:ZOOM, attributionControl:false });
    m2.on("load", ()=>log("greenery map: LOAD ok ✓"));
    m2.on("error", e=>log("greenery map error: " + (e.error && e.error.message || JSON.stringify(e.error||e)), "err"));
  } catch(e){ log("greenery setup threw: " + (e.message||e), "err"); }
})();
</script>
</body>
</html>
