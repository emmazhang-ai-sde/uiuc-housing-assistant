<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>UIUC basemap — live color editor</title>
<link href="/node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<script src="/node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<style>
  html,body { margin:0; height:100%; font-family: system-ui, -apple-system, sans-serif; color:#222; }
  #app { display:flex; height:100vh; }
  #panel { width:340px; flex-shrink:0; background:#f7f6f4; border-right:1px solid #e2ded7; overflow-y:auto; padding:14px 16px 28px; box-sizing:border-box; }
  #panel h1 { font-size:15px; margin:2px 0 4px; }
  #panel .hint { font-size:11.5px; color:#8a8378; margin:0 0 14px; line-height:1.45; }
  .grp { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#a49c8f; font-weight:600; margin:16px 0 7px; }
  .row { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .row label { flex:1; font-size:13px; color:#3a352d; }
  .row input[type=color] { width:30px; height:26px; padding:0; border:1px solid #d7d2c8; border-radius:6px; background:none; cursor:pointer; }
  .row input[type=text] { width:88px; font:12.5px ui-monospace,Menlo,monospace; padding:5px 7px; border:1px solid #d7d2c8; border-radius:6px; text-transform:uppercase; }
  .row input[type=text].bad { border-color:#e06666; background:#fff2f2; }
  .slider { margin:6px 0 2px; }
  .slider label { font-size:13px; color:#3a352d; display:flex; justify-content:space-between; }
  .slider input { width:100%; }
  .actions { display:flex; gap:8px; margin:14px 0 8px; }
  .actions button { font-size:12.5px; padding:7px 10px; border:1px solid #cfc9bd; background:#fff; border-radius:7px; cursor:pointer; }
  .actions button:hover { background:#efece6; }
  #out { width:100%; box-sizing:border-box; height:150px; font:11.5px ui-monospace,Menlo,monospace; border:1px solid #d7d2c8; border-radius:7px; padding:8px; resize:vertical; margin-top:4px; }
  #mapwrap { position:relative; flex:1; }
  #map { position:absolute; inset:0; }
  #grain { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; background-size:220px 220px; }
  #copied { font-size:12px; color:#3a8a4a; margin-left:6px; opacity:0; transition:opacity .2s; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>Basemap color editor</h1>
    <p class="hint">Pick a color or paste a hex code into any field — the map updates instantly. Scroll/drag the map to move around. When it looks right, hit <b>Copy palette</b> and paste it back to me.</p>
    <div id="controls"></div>

    <div class="slider">
      <label>Paper grain <span id="grainVal">0%</span></label>
      <input id="grain-op" type="range" min="0" max="30" value="0" />
    </div>

    <div class="actions">
      <button id="copy">Copy palette</button>
      <button id="reset">Reset</button>
      <span id="copied">copied ✓</span>
    </div>
    <textarea id="out" readonly></textarea>
  </div>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="grain"></div>
  </div>
</div>

<script>
const OFM = n => `https://tiles.openfreemap.org/styles/${n}`;

// role key -> [label, group]
const ROLES = [
  ["LAND","Land / background","Land"],
  ["RESID","Residential areas","Land"],
  ["LAWN","Parks / grass","Green"],
  ["WOOD","Woods / forest","Green"],
  ["WATER","Water","Water"],
  ["WATERLINE","Water edge","Water"],
  ["BLDG","Buildings","Buildings"],
  ["BLDG_OUT","Building outline","Buildings"],
  ["ROAD","Roads","Roads"],
  ["CASE","Road casing / outline","Roads"],
  ["PATH","Paths / footways","Roads"],
  ["LABEL","Labels (text)","Labels"],
  ["HALO","Label halo","Labels"],
  ["BOUNDARY","Boundaries / contours","Labels"],
];

const DEFAULT = {
  LAND:"#FFFFFF", RESID:"#FFFDEE", ROAD:"#FFFFFF", CASE:"#FFFFFF", PATH:"#D6D6D6",
  LAWN:"#CFECCA", WOOD:"#CFECCA", WATER:"#A4D5F2", WATERLINE:"#A4D5F2",
  BLDG:"#E9EAEF", BLDG_OUT:"#C1C1D1", LABEL:"#546E7A", HALO:"#FFFFFF", BOUNDARY:"#C9C4BC",
};
// Persist the working palette + grain across refreshes; cleared only by Reset.
const STORAGE_KEY = "uiuc:map-editor";
function loadSaved(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (s && s.colors && typeof s.colors === "object") return s;
  } catch(e) { /* ignore malformed storage */ }
  return null;
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ colors: PAL, grain: +grainOp.value })); } catch(e) {}
}
const saved = loadSaved();
let PAL = saved ? { ...DEFAULT, ...saved.colors } : { ...DEFAULT };
const savedGrain = saved && typeof saved.grain === "number" ? saved.grain : 0;

const GRAIN_SVG = "<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>"
  + "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/>"
  + "<feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
document.getElementById("grain").style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(GRAIN_SVG)}")`;

const has = (id, ...k) => k.some(x => (id||"").toLowerCase().includes(x));
function buildStyle(base, C){
  const style = JSON.parse(JSON.stringify(base));
  for (const layer of style.layers){
    const id=layer.id||"", t=layer.type, p=layer.paint=layer.paint||{};
    if (id==="background"){ p["background-color"]=C.LAND; continue; }
    if (has(id,"water")){ if(t==="fill")p["fill-color"]=C.WATER; if(t==="line")p["line-color"]=C.WATERLINE; }
    else if (has(id,"wood","forest")){ if(t==="fill")p["fill-color"]=C.WOOD; }
    else if (has(id,"park","grass","golf","pitch","cemetery","landcover","vegetation","farmland","meadow","garden","recreation")){ if(t==="fill")p["fill-color"]=C.LAWN; }
    else if (has(id,"residential","neighbourhood","suburb","landuse")){ if(t==="fill")p["fill-color"]=C.RESID; }
    else if (has(id,"building")){ if(t==="fill"){p["fill-color"]=C.BLDG;p["fill-outline-color"]=C.BLDG_OUT;} if(t==="fill-extrusion")p["fill-extrusion-color"]=C.BLDG; }
    else if (has(id,"boundary","admin")){ if(t==="line")p["line-color"]=C.BOUNDARY; }
    else if (has(id,"path","pedestrian","footway","track")){ if(t==="line")p["line-color"]=C.PATH; }
    else if (has(id,"road","transport","bridge","tunnel","highway","street","motorway","trunk","primary","secondary","tertiary","minor","service")){
      if(t==="line"){ p["line-color"]=has(id,"casing","outline")?C.CASE:C.ROAD; layer.layout=Object.assign({},layer.layout||{},{"line-join":"round","line-cap":"round"}); }
      if(t==="fill")p["fill-color"]=C.ROAD;
    }
    else if (has(id,"label","place","poi","name")){ if(t==="symbol"){p["text-color"]=C.LABEL;p["text-halo-color"]=C.HALO;p["text-halo-width"]=1.4;} }
  }
  return style;
}

// ---- build control rows ----
const controls = document.getElementById("controls");
let lastGroup = null;
const textInputs = {};
for (const [key,label,group] of ROLES){
  if (group !== lastGroup){ const g=document.createElement("div"); g.className="grp"; g.textContent=group; controls.appendChild(g); lastGroup=group; }
  const row=document.createElement("div"); row.className="row";
  const lab=document.createElement("label"); lab.textContent=label;
  const col=document.createElement("input"); col.type="color"; col.value=PAL[key];
  const txt=document.createElement("input"); txt.type="text"; txt.value=PAL[key]; txt.maxLength=7;
  textInputs[key]={col,txt};
  const setColor = v => { PAL[key]=v; col.value=v; txt.value=v.toUpperCase(); txt.classList.remove("bad"); apply(); save(); };
  col.addEventListener("input", ()=>setColor(col.value));
  txt.addEventListener("input", ()=>{
    let v=txt.value.trim(); if(v && v[0]!=="#") v="#"+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)){ PAL[key]=v; col.value=v; txt.classList.remove("bad"); apply(); save(); }
    else txt.classList.add("bad");
  });
  row.appendChild(lab); row.appendChild(col); row.appendChild(txt); controls.appendChild(row);
}

// grain
const grainEl=document.getElementById("grain"), grainOp=document.getElementById("grain-op"), grainVal=document.getElementById("grainVal");
grainOp.value = String(savedGrain);
function applyGrain(){ const v=+grainOp.value; grainEl.style.opacity=v/100; grainVal.textContent=v+"%"; }
grainOp.addEventListener("input", ()=>{ applyGrain(); save(); });

// output textarea
const out=document.getElementById("out");
function refreshOut(){
  out.value = "const PAL = {\n" + ROLES.map(([k])=>`  ${k}: "${PAL[k]}",`).join("\n") + `\n};\n// grain: ${grainOp.value}%`;
}

document.getElementById("copy").addEventListener("click", ()=>{
  refreshOut(); out.select(); navigator.clipboard?.writeText(out.value);
  const c=document.getElementById("copied"); c.style.opacity=1; setTimeout(()=>c.style.opacity=0,1200);
});
document.getElementById("reset").addEventListener("click", ()=>{
  PAL={...DEFAULT};
  for(const [k] of ROLES){ textInputs[k].col.value=PAL[k]; textInputs[k].txt.value=PAL[k]; textInputs[k].txt.classList.remove("bad"); }
  grainOp.value=0; applyGrain(); apply();
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}  // clear only on manual reset
});

// ---- map ----
let map, BASE;
function apply(){ if(map&&BASE) map.setStyle(buildStyle(BASE,PAL)); refreshOut(); }
(async()=>{
  BASE = await (await fetch(OFM("positron"))).json();
  map = new maplibregl.Map({ container:"map", style:buildStyle(BASE,PAL), center:[-88.2272,40.1092], zoom:14.3, attributionControl:false });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");
  applyGrain(); refreshOut();
})();
</script>
</body>
</html>
